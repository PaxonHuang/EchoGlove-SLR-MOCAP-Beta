# EchoGlove TensorFlow env (model export / TFLite conversion, CPU-only).
# Recreate with:  conda env create -f glove_relay/environment_tf.yml
name: tf_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pyyaml>=6.0.1
  - pip:
      - tensorflow-cpu>=2.15,<2.17   # CPU-only TF for export/conversion
      - tensorflow-hub>=0.16
      - scikit-learn>=1.3
      - matplotlib>=3.7
      - pandas>=2.0
      - tqdm>=4.66
      # protobuf pinned to avoid TF/Lite schema mismatch (relay uses protobuf>=4.24)
      - protobuf>=4.24,<5
