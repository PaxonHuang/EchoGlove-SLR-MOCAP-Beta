syntax = "proto3";
package echoglove_v5;

message GloveData {
    uint32 version = 1;
    uint32 timestamp = 2;
    uint32 hand_id = 3;          // 0=left, 1=right
    repeated float flex = 4;     // [5]
    repeated float imu = 5;      // [6] euler[3]+gyro[3]
    uint32 l1_gesture_id = 6;
    float l1_confidence = 7;
    repeated float relative = 8; // [6] filled by receiver
    uint32 tier2_gesture_id = 9;
    float tier2_confidence = 10;
    string status = 11;
}

message ReceiverPacket {
    uint32 version = 1;
    uint32 tick_id = 2;
    GloveData left = 3;
    GloveData right = 4;
    repeated float relative_features = 5; // [6]
}

message BaseStationStatus {
    bool c6_connected = 1;
    bool p4_ready = 2;
    float cpu_usage = 3;
    float mem_usage = 4;
    uint32 uptime_s = 5;
    uint32 active_tier = 6;  // 1=glove-only, 2=P4, 3=PC
}

message BaseStationPacket {
    uint32 version = 1;
    uint32 tick_id = 2;
    GloveData left = 3;
    GloveData right = 4;
    repeated float relative_features = 5;  // [6]
    uint32 tier2_gesture_id = 6;
    float tier2_confidence = 7;
    BaseStationStatus base_station = 8;
}
