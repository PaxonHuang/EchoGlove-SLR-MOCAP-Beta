# EchoGlove Relay + training/inference environment (Ubuntu x64, NVIDIA CUDA 12.1).
# Reflects the verified pytorch_env (2026-08-11, M1) — Python 3.11 + CUDA torch.
# Recreate with:  conda env create -f glove_relay/environment.yml
# Update with:     conda env update -f glove_relay/environment.yml --prune
#
# NOTE: this machine's GPU makes torch.cuda.is_available()==True; the model
# registry defaults to CUDA. Do NOT downgrade to cpuonly here.
name: pytorch_env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # CUDA-enabled PyTorch stack (CUDA 12.1 — matches the verified build)
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1
  # Scientific stack (conda-provided in the verified env)
  - numpy>=1.24
  - pyyaml>=6.0.1
  - pip:
      - -r requirements.txt       # relay server deps (fastapi/uvicorn/websockets/...)
      - -r requirements-dev.txt   # test/dev deps (pytest/httpx/pytest-asyncio)
      # scikit-learn / matplotlib ship via pip (pypi installs in the verified env)
      - scikit-learn>=1.3
      - matplotlib>=3.7
      # training-only extras not in relay requirements.txt
      - pandas>=2.0
      - tqdm>=4.66
      - tensorboard>=2.15
