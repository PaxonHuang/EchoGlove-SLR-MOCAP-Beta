; =============================================================================
; P4 Base Station — Native Test Configuration
; =============================================================================
; Runs on host machine (no hardware needed) for fast TDD cycles.
; =============================================================================

[env:native]
platform = native
build_flags =
    -DUNIT_TEST
    -std=c++17
    -I../../include
    -I../../shared
    -I../../receiver/lib
    ; tflite_infer.h lives in the P4 firmware component directory
    -I../p4_firmware/components/tflite_micro
    ; Provide host-side stubs for esp_log.h / esp_timer.h so the real
    ; tflite_infer.cpp can compile natively without the ESP-IDF toolchain.
    -Iinclude

; Build the real tflite_infer.cpp into native test binaries by treating
; the P4 component directory as a PlatformIO library.  This lets
; test_tflite_stub link against the actual tflite_init/tflite_run
; implementation instead of a duplicate.
lib_extra_dirs = ../p4_firmware/components
