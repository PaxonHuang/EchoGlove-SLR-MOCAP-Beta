; =============================================================================
; EdgeAI Data Glove V3 — PlatformIO Configuration
; =============================================================================
; MCU: ESP32-S3-DevKitC-1 N16R8 (dual-core 240 MHz, 16 MB Flash, 8 MB PSRAM)
; Framework: Arduino + ESP-IDF 5.x (via espressif32 platform)
; Purpose: Sign language data acquisition, L1 inference, WiFi/BLE telemetry
; =============================================================================

[env:esp32-s3-devkitc-1-n16r8]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino

; ---- Board-specific: ESP32-S3-DevKitC-1 N16R8 ----
; 板定义 JSON 已修改为 N16R8 配置 (16MB flash, 8MB PSRAM, qio_qspi)
; N8 备份文件: ~/.platformio/platforms/espressif32/boards/esp32-s3-devkitc-1.json.bak_n8


; ---- Board-specific: enable octal PSRAM (8 MB) ----
board_build.partitions = huge_app.csv
board_build.psram      = enable
board_build.f_flash    = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi

; ---- Build flags ----
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Force USB CDC as default Serial output (ESP32-S3 DevKit)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DCONFIG_TCPIP_LWIP=1
    ; Optimize for speed & reduce PSRAM fragmentation
    -O2
    ; TFLite Micro needs PSRAM arena — define model buffer size (bytes)
    -DTFLITE_MODEL_ARENA_SIZE=512000
    ; UDP telemetry port (config override)
    -DCONFIG_UDP_PORT=8888
    ; Include path for test files to find lib/ headers
    -Ilib

; ---- Serial monitor ----
monitor_speed = 115200
monitor_filters = esp32_exception_decoder 

; ---- Library dependencies ----
lib_deps =
    ; Nanopb — lightweight Protobuf for embedded (C)
    nanopb/Nanopb @ ^0.4.8
    ; Adafruit BNO08x — IMU via SH-2 interface (I2C)
    adafruit/Adafruit BNO08x @ ^1.2.3
    ; Adafruit BusIO — shared I2C/SPI abstraction
    adafruit/Adafruit BusIO @ ^1.14.3
    ; NimBLE-Arduino — BLE 5.0 stack (replaces Bluedroid)
    h2zero/NimBLE-Arduino @ ^1.4.2
    ; ArduinoJson — parsing model_config.yaml / SPIFFS config
    bblanchon/ArduinoJson @ ^7.0.4
    ; TensorFlow Lite for Microcontrollers (ESP32 optimized)
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
    ; Preferences — NVS key-value store (built-in Arduino-ESP32 lib)
    ; Required by InternalADCManager.h (V6 ADC calibration persistence)
    Preferences

; ---- Library dependency finder ----
; deep+ scans #include chains in headers (InternalADCManager.h includes
; <Preferences.h>, which chain mode would miss since it only scans sources)
lib_ldf_mode = deep+

; ---- Extra source directories ----
lib_extra_dirs =
    lib

; ---- SPIFFS / LittleFS upload ----
board_build.filesystem = spiffs

; ---- Build warnings ----
build_unflags = -Werror

; =============================================================================
; BNO085 Diagnostic — minimal build, no BLE / TFLite / Nanopb
; Usage: pio run -e bno085-diag -t upload && pio device monitor -e bno085-diag
; =============================================================================
[env:bno085-diag]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
; Minimal build flags — let board defaults handle everything
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.3
    adafruit/Adafruit BusIO @ ^1.14.3
build_src_filter =
    +<main.cpp>
    -<../lib/Sensors/>
    -<../lib/Models/>
    -<../lib/Comms/>
    -<../lib/Filters/>
monitor_speed = 115200

; =============================================================================
; ADS1115 Diagnostic — minimal build for ADC testing
; Usage: pio run -e ads1115-diag -t upload && pio device monitor -e ads1115-diag
; =============================================================================
[env:ads1115-diag]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit BusIO @ ^1.14.3
build_src_filter =
    +<main.cpp>
    -<../lib/Sensors/>
    -<../lib/Models/>
    -<../lib/Comms/>
    -<../lib/Filters/>
monitor_speed = 115200

; =============================================================================
; I2C Bus Diagnostic — minimal build, multi-pin I2C scan
; Usage: pio run -e i2c-diag -t upload --upload-port /dev/ttyACM0
;        pio device monitor -e i2c-diag
; =============================================================================
[env:i2c-diag]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<test/test_i2c_scan/test_main.cpp>
    -<main.cpp>
    -<lib/>
    -<src/>
monitor_speed = 115200

; =============================================================================
; V5 Quick Multi-pin I2C Scan
; Tests GPIO8/9 and GPIO4/5 at 100kHz and 400kHz
; Usage: pio run -e v5-qscan -t upload && pio device monitor -e v5-qscan
; =============================================================================
[env:v5-qscan]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
board_build.partitions = huge_app.csv
board_build.psram      = enable
board_build.f_flash    = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<../test/test_v5_quick_scan/test_main.cpp>
    -<main.cpp>
    -<lib/>
    -<src/>
    -<test/>
monitor_speed = 115200

; =============================================================================
; V5 I2C Device Isolation Test
; Tests each I2C device individually at 100kHz/400kHz to find bus problems
; Usage: pio run -e v5-isolate -t upload && pio device monitor -e v5-isolate
; =============================================================================
[env:v5-isolate]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
board_build.partitions = huge_app.csv
board_build.psram      = enable
board_build.f_flash    = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.3
    adafruit/Adafruit BusIO @ ^1.14.3
build_src_filter =
    +<../test/test_v5_isolation/test_main.cpp>
    -<main.cpp>
    -<lib/>
    -<src/>
    -<test/>
monitor_speed = 115200

; =============================================================================
; V5 Comprehensive Hardware Diagnostic
; Full test suite: system info → I2C scan → ADS1115×2 → BNO085 → flex → stream
; Usage: pio run -e v5-diag -t upload && pio device monitor -e v5-diag
; =============================================================================
[env:v5-diag]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
board_build.partitions = huge_app.csv
board_build.psram      = enable
board_build.f_flash    = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Ilib
    -Iinclude
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.3
    adafruit/Adafruit BusIO @ ^1.14.3
build_src_filter =
    +<../test/test_v5_diagnostic/test_main.cpp>
    -<main.cpp>
    -<lib/>
    -<src/>
    -<test/>
monitor_speed = 115200

; =============================================================================
; Hardware Diagnostic — on-target Unity test for all V5 sensors
; Usage: pio test -e hardware_diag
; =============================================================================
[env:hardware_diag]
platform      = espressif32@^6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
board_build.partitions = huge_app.csv
board_build.psram      = enable
board_build.f_flash    = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DECHO_HARDWARE_TEST
    -Ilib
    -Iinclude
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.3
    adafruit/Adafruit BusIO @ ^1.14.3
monitor_speed = 115200
test_filter = test_v5_hardware

; =============================================================================
; Native test environment — runs on host machine (fast TDD cycles)
; =============================================================================
[env:native]
platform = native
build_flags =
    -Ilib
    -Iinclude
    -DUNIT_TEST

; =============================================================================
; Overridden monitors / debug
; =============================================================================
[env:esp32-s3-devkitc-1-n16r8_debug]
extends = env:esp32-s3-devkitc-1-n16r8
build_type = debug
build_flags =
    ${env:esp32-s3-devkitc-1-n16r8.build_flags}
    -DDEBUG_BUILD=1
    -DCORE_DEBUG_LEVEL=5
