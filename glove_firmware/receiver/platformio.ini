; Receiver firmware — ESP32-S3 data aggregation + Tier2 inference
[env:receiver]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DUNIT_TEST=0

[env:native]
platform = native
build_flags = -DUNIT_TEST
test_filter = test_*
